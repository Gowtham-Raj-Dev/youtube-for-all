<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Bulk upload and schedule YouTube videos and Shorts for free. Autopilot publishes on time even when your PC is off — using your own YouTube API and Google Drive." />
    <meta name="theme-color" content="#0b0b10" />
    <link rel="canonical" href="https://youtube.codelove.in/" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
