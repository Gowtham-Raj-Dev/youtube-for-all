<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The same build serves from a domain root (utubeflow.codelove.in/) and from a GitHub Pages
      // project path (<user>.github.io/youtube-for-all/). Pick the base before any asset loads so
      // relative URLs (./assets, favicon.svg…) resolve correctly — also on deep links via 404.html.
      (function () {
        var seg = location.pathname.split("/")[1];
        var base = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
        window.__BASE__ = base;
        document.write('<base href="' + base + '" />');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>UTubeFlow — Free YouTube Automation by CodeLove</title>
    <meta name="description" content="Bulk upload and schedule YouTube videos and Shorts for free. Autopilot publishes on time even when your PC is off — using your own YouTube API and Google Drive." />
    <meta name="theme-color" content="#060c0a" />
    <link rel="canonical" href="https://utubeflow.codelove.in/" />

    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UTubeFlow by CodeLove" />
    <meta property="og:title" content="UTubeFlow — Free YouTube Automation" />
    <meta property="og:description" content="Bulk upload and schedule videos and Shorts. Autopilot publishes on time even when your PC is off. 100% free." />
    <meta property="og:url" content="https://utubeflow.codelove.in/" />
    <meta property="og:image" content="https://utubeflow.codelove.in/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
